
name: Build Physics by Azanaw Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Physics_by_Azanaw_Android_Project.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir extracted
          unzip -q Physics_by_Azanaw_Android_Project.zip -d extracted
          find extracted -name settings.gradle -o -name settings.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"
          echo "Android project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Physics-by-Azanaw-debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
